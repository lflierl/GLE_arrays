#
# Windows CLI build for GLE.
# The development mode builds the command-line executable and its runtime
# resources without building unrelated targets. The full mode builds all
# enabled targets. Qt/GUI is intentionally disabled: this fork is tested
# through gle.exe and does not require qgle.exe.
#
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Development = CLI executable and runtime files; Full = all enabled targets"
        required: true
        type: choice
        options:
          - development
          - full
        default: development

env:
  BUILD_TYPE: Release
  TRIPLET: x64-windows-static-release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
  BUILD_MODE: ${{ inputs.build_mode }}

jobs:
  build:
    name: Build Windows (${{ inputs.build_mode }})
    runs-on: windows-latest

    steps:
      - name: Set workspace path
        shell: pwsh
        run: |
          "WS=${{ github.workspace }}".Replace('\','/') >> $env:GITHUB_ENV

      - name: Checkout GLE
        uses: actions/checkout@v7

      - name: Acquire vcpkg
        uses: actions/checkout@v7
        with:
          repository: Microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # Reuse compiled vcpkg packages between runs. The cache key includes
      # the manifest and commit; the restore prefix lets later commits reuse
      # packages built by an earlier run.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-windows-${{ env.TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-windows-${{ env.TRIPLET }}-${{ hashFiles('src/vcpkg.json') }}-

      # Ghostscript is only needed for the complete distribution. Array tests
      # run against the CLI executable and do not need the external renderer.
      - name: Setup Ghostscript
        if: ${{ inputs.build_mode == 'full' }}
        uses: ./.github/actions/setup-ghostscript-win
        with:
          checkout-ghostpdl: "true"

      - name: Configure CMake
        working-directory: ${{ github.workspace }}
        run: >
          cmake -B build -S src
          -DCMAKE_TOOLCHAIN_FILE=${{ env.WS }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }}
          -DVCPKG_MANIFEST_MODE=ON
          -DVCPKG_MANIFEST_DIR=${{ env.WS }}/src
          -DVCPKG_INSTALLED_DIR=${{ env.WS }}/build/vcpkg_installed
          -DGHOSTPDL_ROOT=${{ env.WS }}/ghostpdl
          -DMSVC_USE_STATIC_RUNTIME=ON
          -DCMAKE_INSTALL_PREFIX=${{ env.WS }}/stage
          -DGLE_EXAMPLES_LIBRARY_PATH="${{ env.WS }}/gle-library"
          -DGLE_USER_MANUAL_PATH="${{ env.WS }}/gle-manual"
          -DPOPPLER_INTERFACE=CPP
          -DBUILD_GUI=OFF
          -DBUILD_MANIP=OFF
          -DBUILD_TESTS=ON
        shell: cmd

      - name: Build development targets
        if: ${{ inputs.build_mode == 'development' }}
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target gle glerc_file --parallel 4
          if not exist stage\bin mkdir stage\bin
          copy /Y build\gle\Release\gle.exe stage\bin\gle.exe
          copy /Y build\gle\glerc stage\glerc
        shell: cmd

      - name: Build all enabled targets
        if: ${{ inputs.build_mode == 'full' }}
        working-directory: ${{ github.workspace }}
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4
        shell: cmd

      - name: Install full CLI distribution
        if: ${{ inputs.build_mode == 'full' }}
        working-directory: ${{ github.workspace }}
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }}
        shell: cmd

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: Windows Binaries
          path: ${{ github.workspace }}/stage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
